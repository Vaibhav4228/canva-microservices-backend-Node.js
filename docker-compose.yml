services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "5000:5000"
    env_file:
      - ./api-gateway/.env
    environment:
      PORT: 5000
      DESIGN: http://design-service:5001
      UPLOAD: http://upload-service:5002
      SUBSCRIPTION: http://subscription-service:5003
      AI: http://ai-service:5004
    depends_on:
      design-service:
        condition: service_healthy
      upload-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  design-service:
    build: ./design-service
    expose:
      - "5001"
    env_file:
      - ./design-service/.env
    environment:
      PORT: 5001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  upload-service:
    build: ./upload-service
    expose:
      - "5002"
    env_file:
      - ./upload-service/.env
    environment:
      PORT: 5002
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  subscription-service:
    build: ./subscription-service
    expose:
      - "5003"
    env_file:
      - ./subscription-service/.env
    environment:
      PORT: 5003
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    expose:
      - "5004"
    env_file:
      - ./ai-service/.env
    environment:
      PORT: 5004
      KAFKA_DISABLED: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5004/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped
